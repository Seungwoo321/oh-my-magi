[workspace]
members = [
  ".",
  "crates/magi-context",
  "crates/magi-domain",
  "crates/magi-provider",
  "crates/magi-storage",
]
resolver = "2"

[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }

[package]
name = "magi-console"
default-run = "magi-console"
version = "0.1.0"
description = "Local MAGI command console for macOS"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "magi-run-query"
path = "src/bin/magi-run-query.rs"

[features]
native-live-probe = ["dep:plist"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "magi-native-live-probe"
path = "src/bin/magi-native-live-probe.rs"
required-features = ["native-live-probe"]

[lib]
name = "magi_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
magi-provider = { path = "crates/magi-provider" }
magi-domain = { path = "crates/magi-domain" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
libc = "0.2"

[dependencies]
plist = { version = "=1.10.1", optional = true }
tokio = { version = "1", features = ["time"] }
schemars = "=0.8.22"
cap-std = "=3.4.6"
libc = "0.2"
magi-context = { path = "crates/magi-context" }
magi-domain = { path = "crates/magi-domain" }
magi-provider = { path = "crates/magi-provider" }
magi-storage = { path = "crates/magi-storage" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

tauri-plugin-updater = "=2.11.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"
minisign-verify = "0.2"

[dev-dependencies]
tauri-build = { version = "2", features = [] }

[[test]]
name = "resource-build-contract"
path = "tests/resource-build-contract.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow", "objc2-uniform-type-identifiers"] }
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString", "NSURL"] }

objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }
