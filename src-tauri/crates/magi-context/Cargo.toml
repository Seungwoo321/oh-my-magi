[package]
name = "magi-context"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
cap-std = "=3.4.6"
libc = "0.2"
magi-domain = { path = "../magi-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
