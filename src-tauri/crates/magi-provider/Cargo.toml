[package]
name = "magi-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fs2 = "0.4"
rusqlite = "0.32"
base64 = "0.22"
zeroize = "1.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = "=0.12.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
