[package]
name = "magi-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fs2 = "0.4"
libc = "0.2"
magi-context = { path = "../magi-context" }
magi-domain = { path = "../magi-domain" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.55", default-features = false, features = ["parsing", "std"] }
uuid = { version = "1", features = ["v4"] }
